# 站点是静态壳加浏览器直连 API，正常流量用不到几个实例。设上限是为了挡住
# 爬虫或请求堆积时实例数无节制扩张带来的账单，不是性能调优。
# cpu 与 memory 不写，沿用 App Hosting 默认值。
runConfig:
  maxInstances: 5

env:
  # 代发上游请求时，部分响应到达本服务时带有超过 Node 默认 16KB 上限的头，
  # 超限时转发直接失败成 500。
  - variable: NODE_OPTIONS
    value: --max-http-header-size=65536
    availability:
      - RUNTIME
