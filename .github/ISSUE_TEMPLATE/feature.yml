name: 实现功能（我打算自己实现）/ Implement a feature (I will implement it)
description: 我有具体的代码方案，打算自己实现 / I have a concrete code plan and will implement it myself
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        **如果你是玩家，只是有想法或建议，请到[反馈页面](https://windy10v10ai.com/feedback)，不需要懂代码。** 这里只给打算自己写代码实现的人。
        If you are a player with an idea or suggestion, please use the [feedback page](https://windy10v10ai.com/feedback). This form is for people who will write the code themselves.

        功能类改动原则上由维护者自己实现，**请先在这里说明方案，等维护者同意后再动手**。没有事先达成一致就提交的功能 PR 可能会被关闭。
        请先搜索[已有的 Issue](https://github.com/windy10v10ai/firebase/issues)。
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题 / What problem does this solve
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: 实现方案 / Your implementation plan
      description: 大致做法、涉及 API、网站还是启动器 / The rough approach, and whether it touches the API, website or launcher
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 改动范围 / Scope of the change
      description: 涉及哪些文件或模块；明确不做什么 / The files or modules involved, and what you will not change
    validations:
      required: true
  - type: dropdown
    id: sensitive
    attributes:
      label: 是否涉及敏感区域 / Does it touch a sensitive area
      description: 付款、会员和积分、玩家数据迁移、Firestore 安全规则、启动器发布 / Payments, membership and points, player data migration, Firestore rules, launcher release
      options:
        - 不涉及 / No
        - 涉及（已在下面说明）/ Yes (explained below)
      default: 0
    validations:
      required: true
  - type: textarea
    id: sensitive-detail
    attributes:
      label: 敏感区域的影响和风险 / Impact and risk of the sensitive area
      description: 上一项选「涉及」时必填；不涉及可留空 / Required if you chose "Yes" above; leave empty otherwise
  - type: textarea
    id: alternatives
    attributes:
      label: 其他考虑过的做法 / Alternatives (optional)
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认 / Before you submit
      options:
        - label: 我打算自己实现，并会等维护者同意后再动手 / I will implement it myself and wait for the maintainer to agree first
          required: true
        - label: 我搜索过已有的 Issue，没有重复 / I searched existing issues and found no duplicate
          required: true
