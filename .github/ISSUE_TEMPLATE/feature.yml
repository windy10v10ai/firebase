name: 功能建议 / Feature request
description: 想要新功能或改动现有行为 / A new feature, or a change to existing behavior
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！功能类改动原则上由维护者自己实现，所以请先在这里说明想法，**不要先写代码**。没有事先达成一致就提交的功能 PR 可能会被关闭。
        涉及付款、会员和积分、玩家数据、安全规则、启动器发布的改动，哪怕很小也请先在这里讨论。
        请先搜索[已有的 Issue](https://github.com/windy10v10ai/firebase/issues)。
  - type: dropdown
    id: component
    attributes:
      label: 涉及的部分 / Which part
      options:
        - 网站 / Website
        - API / 服务端
        - 启动器 / Launcher
        - 不确定 / Not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题 / What problem does this solve
      description: 现在哪里不方便或缺少什么 / What is inconvenient or missing today
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 建议的做法 / What you suggest
      description: 希望变成什么样；有界面的可以附草图 / What it should become; a sketch helps for UI
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他考虑过的做法 / Alternatives (optional)
  - type: dropdown
    id: implement
    attributes:
      label: 谁来实现 / Who will implement it
      options:
        - 只提建议，请维护者决定 / Suggestion only, up to the maintainer
        - 我想自己实现（先讨论，同意后再动手）/ I want to implement it (discuss first)
      default: 0
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认 / Before you submit
      options:
        - label: 我搜索过已有的 Issue，没有重复 / I searched existing issues and found no duplicate
          required: true
        - label: 我了解功能类改动原则上由维护者实现 / I understand features are implemented by the maintainer by default
          required: true
