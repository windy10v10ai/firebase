name: Deploy Firebase
on:
  push:
    branches:
      - main
    # 用排除而不是白名单：这里漏掉一条只是多发一次，白名单漏掉一条会静默不发。
    # 网站在 web/ 下，由 App Hosting 自己构建发布，与这个 workflow 无关。
    paths-ignore:
      - 'web/**'
      - 'docs/**'
      - '.claude/**'
      - '.cursor/**'
      - '.vscode/**'
      - '**.md'

permissions:
  contents: read

jobs:
  build_and_deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: api/package-lock.json

      # firebase.json 的 functions predeploy 会在容器里 lint 和 build，但不装依赖
      - name: Install API dependencies
        run: npm ci --prefix api

      - name: Deploy to Firebase
        uses: w9jds/firebase-action@c38233488869fe50f21a3ab4931095d09807cc7a # v15.29.0
        with:
          args: deploy --only functions,hosting,firestore
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WINDY10V10AI }}
          PROJECT_ID: windy10v10ai
