name: Deploy Firebase
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build_and_deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve deploy targets
        id: scope
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          functions=false
          hosting=false
          rules=false
          indexes=false

          deploy_everything() {
            functions=true
            hosting=true
            rules=true
            indexes=true
          }

          # 首次 push 与 force push 的 before 指向取不到的提交，宁可多发一次也不能漏发
          if ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            deploy_everything
          else
            while IFS= read -r file; do
              case "$file" in
                api/*|.nvmrc)
                  functions=true
                  ;;
                public/*)
                  hosting=true
                  ;;
                firestore.rules)
                  rules=true
                  ;;
                firestore.indexes.json)
                  indexes=true
                  ;;
                firebase.json|.firebaserc|.github/workflows/deploy_firebase.yml)
                  deploy_everything
                  ;;
              esac
            done < <(git diff --name-only --no-renames "$BEFORE_SHA...$HEAD_SHA")
          fi

          targets=()
          if [[ "$functions" == true ]]; then targets+=(functions); fi
          if [[ "$hosting" == true ]]; then targets+=(hosting); fi
          if [[ "$rules" == true ]]; then targets+=(firestore:rules); fi
          if [[ "$indexes" == true ]]; then targets+=(firestore:indexes); fi

          only=$(IFS=,; echo "${targets[*]}")
          echo "only=$only" >> "$GITHUB_OUTPUT"
          echo "Deploy targets: ${only:-<none>}"

      - name: Setup Node
        if: contains(steps.scope.outputs.only, 'functions')
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: api/package-lock.json

      # firebase.json 的 functions predeploy 会在容器里 lint 和 build，但不装依赖
      - name: Install API dependencies
        if: contains(steps.scope.outputs.only, 'functions')
        run: npm ci --prefix api

      - name: Deploy to Firebase
        if: steps.scope.outputs.only != ''
        uses: w9jds/firebase-action@v15.22.3
        with:
          args: deploy --only ${{ steps.scope.outputs.only }}
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WINDY10V10AI }}
          PROJECT_ID: windy10v10ai
