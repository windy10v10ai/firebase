name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      launcher: ${{ steps.filter.outputs.launcher }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed projects
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          api=false
          web=false
          launcher=false
          skills=false

          while IFS= read -r file; do
            case "$file" in
              api/*|firestore.indexes.json|firestore.rules)
                api=true
                ;;
              web/*)
                web=true
                ;;
              launcher/*)
                launcher=true
                ;;
              .github/workflows/ci.yml)
                api=true
                web=true
                launcher=true
                skills=true
                ;;
              .claude/skills/*|scripts/*agent-skills*)
                skills=true
                ;;
              .nvmrc|.prettierrc|firebase.json|package.json|package-lock.json)
                api=true
                web=true
                skills=true
                ;;
            esac
          done < <(git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA")

          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "launcher=$launcher" >> "$GITHUB_OUTPUT"
          echo "skills=$skills" >> "$GITHUB_OUTPUT"

      - name: Validate skill frontmatter
        if: steps.filter.outputs.skills == 'true'
        run: npm run skills:check

  api-quality:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit test
        run: npm run test

  api-e2e:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: E2E test
        run: npm run test:e2e

  web-quality:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Heading font coverage
        run: npm run font:heading:check

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  launcher-build:
    needs: changes
    if: needs.changes.outputs.launcher == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: launcher\build.cmd
        shell: cmd

      - name: Test
        run: launcher\test.cmd
        shell: cmd

  launcher-core-mac:
    needs: changes
    if: needs.changes.outputs.launcher == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Format check
        run: dotnet format whitespace launcher --folder --verify-no-changes

      - name: Test shared core
        run: dotnet run --project launcher/core/tests/dotnet/CoreTests.csproj

      - name: Test Mac launcher offline
        run: bash launcher/macos/test.sh

      - name: Build and verify Mac application
        run: bash launcher/macos/build.sh

  ci:
    if: ${{ !cancelled() }}
    needs: [changes, api-quality, api-e2e, web-quality, launcher-build, launcher-core-mac]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          API_CHANGED: ${{ needs.changes.outputs.api }}
          WEB_CHANGED: ${{ needs.changes.outputs.web }}
          API_QUALITY_RESULT: ${{ needs.api-quality.result }}
          API_E2E_RESULT: ${{ needs.api-e2e.result }}
          WEB_QUALITY_RESULT: ${{ needs.web-quality.result }}
          LAUNCHER_CHANGED: ${{ needs.changes.outputs.launcher }}
          LAUNCHER_BUILD_RESULT: ${{ needs.launcher-build.result }}
          LAUNCHER_CORE_MAC_RESULT: ${{ needs.launcher-core-mac.result }}
        run: |
          [[ "$CHANGES_RESULT" == "success" ]]

          check_result() {
            local changed="$1"
            local result="$2"

            if [[ "$changed" == "true" ]]; then
              [[ "$result" == "success" ]]
            else
              [[ "$result" == "skipped" ]]
            fi
          }

          check_result "$API_CHANGED" "$API_QUALITY_RESULT"
          check_result "$API_CHANGED" "$API_E2E_RESULT"
          check_result "$WEB_CHANGED" "$WEB_QUALITY_RESULT"
          check_result "$LAUNCHER_CHANGED" "$LAUNCHER_BUILD_RESULT"
          check_result "$LAUNCHER_CHANGED" "$LAUNCHER_CORE_MAC_RESULT"
