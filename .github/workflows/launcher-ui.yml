name: Launcher UI previews

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        type: choice
        default: both
        options: [both, windows, macos]
      scope:
        description: Screens to capture
        type: choice
        default: all
        options: [all, host, join, feedback]
      language:
        description: Language
        type: choice
        default: all
        options: [all, zh-CN, en-US, ru-RU]
  pull_request:
    paths:
      - .github/workflows/launcher-ui.yml
      - launcher/test-ui.ps1
      - launcher/tests/ui-preview.cs
      - launcher/macos/test-ui.sh
      - launcher/ui-preview-summary.py

permissions:
  contents: read

env:
  UI_SCOPE: ${{ inputs.scope || 'all' }}
  UI_LANGUAGE: ${{ inputs.language || 'all' }}

jobs:
  windows-ui:
    if: ${{ github.event_name == 'pull_request' || inputs.platform == 'both' || inputs.platform == 'windows' }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build Windows launcher
        run: launcher\build.cmd
        shell: cmd
      - name: Capture Windows UI
        shell: pwsh
        run: ./launcher/test-ui.ps1 -OutputDirectory "$env:RUNNER_TEMP/launcher-ui-windows" -Scope $env:UI_SCOPE -Language $env:UI_LANGUAGE
      - name: Prepare screenshot overview
        if: always()
        run: python launcher/ui-preview-summary.py "${{ runner.temp }}/launcher-ui-windows"
      - name: Upload Windows screenshots and logs
        if: always()
        id: screenshots
        uses: actions/upload-artifact@v7
        with:
          name: launcher-ui-windows
          path: ${{ runner.temp }}/launcher-ui-windows/
          if-no-files-found: error
          retention-days: 14
      - name: Link screenshot download
        if: always()
        env:
          UI_ARTIFACT_URL: ${{ steps.screenshots.outputs.artifact-url }}
        run: python launcher/ui-preview-summary.py "${{ runner.temp }}/launcher-ui-windows" --artifact-url "$env:UI_ARTIFACT_URL"

  macos-ui:
    if: ${{ github.event_name == 'pull_request' || inputs.platform == 'both' || inputs.platform == 'macos' }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build Mac launcher
        run: bash launcher/macos/build.sh
      - name: Capture Mac UI
        run: bash launcher/macos/test-ui.sh "$RUNNER_TEMP/launcher-ui-macos" "$UI_SCOPE" "$UI_LANGUAGE"
      - name: Prepare screenshot overview
        if: always()
        run: python3 launcher/ui-preview-summary.py "$RUNNER_TEMP/launcher-ui-macos"
      - name: Upload Mac screenshots and logs
        if: always()
        id: screenshots
        uses: actions/upload-artifact@v7
        with:
          name: launcher-ui-macos
          path: ${{ runner.temp }}/launcher-ui-macos/
          if-no-files-found: error
          retention-days: 14
      - name: Link screenshot download
        if: always()
        env:
          UI_ARTIFACT_URL: ${{ steps.screenshots.outputs.artifact-url }}
        run: python3 launcher/ui-preview-summary.py "$RUNNER_TEMP/launcher-ui-macos" --artifact-url "$UI_ARTIFACT_URL"
